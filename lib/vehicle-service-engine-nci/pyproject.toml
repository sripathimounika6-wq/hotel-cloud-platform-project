[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "vehicle-service-engine-nci"
version = "1.0.0"
description = "OOP business-rules engine for vehicle service bookings: cancellation policy, dynamic labor pricing, and bay-overbooking resolution."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" }
]
keywords = ["cloud-computing", "aws-lambda", "serverless", "vehicle-service", "strategy-pattern"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/YOUR-GITHUB-USERNAME/fleet-cloud-project"
Repository = "https://github.com/YOUR-GITHUB-USERNAME/fleet-cloud-project"

[tool.setuptools.packages.find]
include = ["vehicle_service_engine*"]
