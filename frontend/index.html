<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ironclad Auto — Service Booking</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --asphalt:#1a1d20;
    --panel:#24282c;
    --line:#3a3f44;
    --safety:#ff6a13;
    --safety-dim:#7a3a14;
    --paper:#e9e6df;
    --paper-dim:rgba(233,230,223,0.55);
    --ok:#4caf6a;
    --err:#e0523f;
  }

  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--asphalt);
    background-image:
      repeating-linear-gradient(135deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 8px);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    -webkit-font-smoothing:antialiased;
  }

  header{
    padding:48px 6vw 36px;
    border-bottom:2px solid var(--safety);
    display:flex; justify-content:space-between; align-items:flex-end; flex-wrap:wrap; gap:20px;
  }
  .brand{
    font-family:'Oswald', sans-serif; font-weight:700; font-size:1.1rem;
    letter-spacing:0.08em; text-transform:uppercase; color:var(--safety);
    display:flex; align-items:center; gap:10px;
  }
  .brand::before{ content:"⛒"; font-size:1.3rem; }
  h1{
    font-family:'Oswald', sans-serif; font-weight:600;
    font-size:clamp(2.2rem, 5vw, 3.6rem);
    text-transform:uppercase; letter-spacing:0.01em;
    margin:14px 0 10px; line-height:1.05; color:var(--paper);
  }
  .lede{ max-width:520px; font-size:14px; line-height:1.7; color:var(--paper-dim); }
  .stamp{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:11px;
    letter-spacing:0.16em; text-transform:uppercase; color:var(--asphalt);
    background:var(--safety); padding:6px 14px; white-space:nowrap;
    transform:rotate(-2deg);
  }

  main{
    padding:56px 6vw 100px;
    display:grid; grid-template-columns:1fr 1fr; gap:40px;
  }
  @media (max-width:900px){ main{grid-template-columns:1fr;} }

  .docket{
    background:var(--panel);
    border:1px solid var(--line);
    position:relative;
  }
  .docket::before{
    content:""; position:absolute; top:0; left:0; right:0; height:6px;
    background:repeating-linear-gradient(90deg, var(--safety) 0 14px, transparent 14px 24px);
  }
  .docket-head{
    display:flex; justify-content:space-between; align-items:center;
    padding:22px 28px 18px; border-bottom:1px dashed var(--line);
  }
  .docket-tag{
    font-family:'Oswald', sans-serif; font-weight:600; font-size:0.95rem;
    text-transform:uppercase; letter-spacing:0.04em; color:var(--paper);
  }
  .docket-num{ font-size:11px; color:var(--safety); letter-spacing:0.1em; }
  .docket-body{ padding:24px 28px 28px; }

  label{
    display:block; font-size:11px; letter-spacing:0.1em; text-transform:uppercase;
    color:var(--paper-dim); margin-bottom:6px; margin-top:18px; font-weight:500;
  }
  label:first-of-type{margin-top:0;}
  input, select{
    width:100%; padding:11px 13px; font-size:14px; font-family:'IBM Plex Mono', monospace;
    border:1px solid var(--line); border-radius:0; background:#15181a; color:var(--paper);
  }
  input:focus, select:focus{ outline:none; border-color:var(--safety); }
  input::placeholder{ color:rgba(233,230,223,0.3); }

  button{
    margin-top:26px; width:100%; padding:14px 20px;
    background:var(--safety); color:var(--asphalt); border:none;
    font-family:'Oswald', sans-serif; font-size:14px; font-weight:700;
    letter-spacing:0.08em; text-transform:uppercase; cursor:pointer;
  }
  button:hover{ background:#ff7d33; }
  button:disabled{ opacity:0.5; cursor:wait; }

  .result{
    margin-top:20px; padding:14px 16px; font-size:12.5px; line-height:1.7;
    white-space:pre-wrap; display:none; border-left:3px solid;
  }
  .result.ok{ display:block; background:rgba(76,175,106,0.08); border-color:var(--ok); color:#a7dab7; }
  .result.err{ display:block; background:rgba(224,82,63,0.08); border-color:var(--err); color:#f0a99e; }

  .config{
    padding:18px 6vw; border-top:1px solid var(--line); font-size:11.5px;
    color:var(--paper-dim); display:flex; gap:20px; flex-wrap:wrap; align-items:center;
  }
  .config input{ width:auto; flex:1; min-width:260px; padding:7px 10px; font-size:11.5px; }
  .config span{ font-weight:600; color:var(--paper); text-transform:uppercase; letter-spacing:0.08em; }

  /* Staff portal */
  .staff-section{
    padding:56px 6vw 90px; border-top:2px solid var(--safety);
  }
  .staff-head{
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:16px;
    margin-bottom:32px;
  }
  .staff-head h2{
    font-family:'Oswald', sans-serif; font-weight:600; text-transform:uppercase;
    font-size:1.4rem; letter-spacing:0.03em; margin:0; color:var(--paper);
  }
  .tab-bar{ display:flex; gap:2px; }
  .tab-btn{
    padding:9px 20px; background:var(--panel); border:1px solid var(--line); color:var(--paper-dim);
    font-family:'IBM Plex Mono', monospace; font-size:12px; letter-spacing:0.05em; text-transform:uppercase;
    cursor:pointer;
  }
  .tab-btn.active{ background:var(--safety); color:var(--asphalt); border-color:var(--safety); font-weight:600; }

  .staff-panel{ display:none; }
  .staff-panel.active{ display:block; }

  .auth-grid{ display:grid; grid-template-columns:1fr 1fr; gap:40px; max-width:900px; }
  @media (max-width:760px){ .auth-grid{ grid-template-columns:1fr; } }

  .stat-grid{
    display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:28px;
  }
  .stat-card{
    background:var(--panel); border:1px solid var(--line); border-left:3px solid var(--safety);
    padding:20px 22px;
  }
  .stat-card .num{ font-family:'Oswald', sans-serif; font-size:2.2rem; font-weight:700; color:var(--paper); line-height:1; }
  .stat-card .label{ font-size:11px; letter-spacing:0.08em; text-transform:uppercase; color:var(--paper-dim); margin-top:8px; }

  .breakdown{
    background:var(--panel); border:1px solid var(--line); padding:20px 24px; margin-bottom:16px;
  }
  .breakdown h3{
    font-family:'Oswald', sans-serif; font-size:0.95rem; text-transform:uppercase; letter-spacing:0.05em;
    margin:0 0 14px; color:var(--safety);
  }
  .breakdown-row{
    display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px dashed var(--line);
    font-size:13px;
  }
  .breakdown-row:last-child{ border-bottom:none; }

  .logout-btn{
    background:transparent; border:1px solid var(--line); color:var(--paper-dim);
    padding:8px 16px; font-size:11px; margin-top:0; width:auto;
  }
  .logout-btn:hover{ background:var(--panel); color:var(--paper); }
</style>
</head>
<body>

<header>
  <div>
    <div class="brand">Auto Service</div>
    <h1>Book the bay.<br>Skip the phone queue.</h1>

  </div>
  <div class="stamp">Fleet &amp; Retail Service Desk</div>
</header>

<main>
  <section class="docket">
    <div class="docket-head">
      <span class="docket-tag">01 · Book a Service Bay</span>
      <span class="docket-num">FORM A-1</span>
    </div>
    <div class="docket-body">
      <form id="apptForm">
        <label for="customer_name">Customer name</label>
        <input id="customer_name" required>

        <label for="vehicle_reg">Vehicle registration</label>
        <input id="vehicle_reg" required placeholder="13-D-45678">

        <label for="service_type">Service type</label>
        <select id="service_type">
          <option>Oil Change</option>
          <option>Full Service</option>
          <option>Diagnostic</option>
          <option>Repair</option>
        </select>

        <label for="appointment_date">Appointment date</label>
        <input id="appointment_date" type="date" required>

        <label for="base_rate">Base rate (€)</label>
        <input id="base_rate" type="number" step="0.01" value="120.00" required>

        <label for="cancellation_policy">Cancellation policy</label>
        <select id="cancellation_policy">
          <option value="FLEXIBLE">Flexible</option>
          <option value="STANDARD" selected>Standard</option>
          <option value="NO_SHOW_STRICT">No-show strict</option>
        </select>

        <button type="submit" id="apptBtn">Confirm appointment</button>
      </form>
      <div class="result" id="apptResult"></div>
    </div>
  </section>

  <section class="docket">
    <div class="docket-head">
      <span class="docket-tag">02 · Additional Request</span>
      <span class="docket-num">FORM A-2</span>
    </div>
    <div class="docket-body">
      <form id="requestForm">
        <label for="appointment_id">Appointment ID</label>
        <input id="appointment_id" required placeholder="paste the appointment_id from a booking">

        <label for="request_type">Request type</label>
        <select id="request_type">
          <option value="COURTESY_VEHICLE">Courtesy vehicle</option>
          <option value="EXTRA_INSPECTION">Extra inspection</option>
          <option value="PICKUP_DROPOFF">Pickup / drop-off</option>
          <option value="PARTS_ORDER">Parts order</option>
        </select>

        <label for="notes">Notes</label>
        <input id="notes" placeholder="Optional — any specifics">

        <button type="submit" id="reqBtn">Send request</button>
      </form>
      <div class="result" id="requestResult"></div>
    </div>
  </section>
</main>

<section class="staff-section">
  <div class="staff-head">
    <h2>Staff Portal</h2>
    <div class="tab-bar">
      <button class="tab-btn active" data-tab="login">Login</button>
      <button class="tab-btn" data-tab="register">Register</button>
      <button class="tab-btn" data-tab="dashboard">Dashboard</button>
    </div>
  </div>

  <div class="auth-grid">
    <div class="staff-panel active" id="panel-login">
      <form id="loginForm">
        <label for="login_email">Email</label>
        <input id="login_email" type="email" required>

        <label for="login_password">Password</label>
        <input id="login_password" type="password" required placeholder="••••••••">

        <button type="submit" id="loginBtn">Log in</button>
      </form>
      <div class="result" id="loginResult"></div>
    </div>

    <div class="staff-panel" id="panel-register">
      <form id="registerForm">
        <label for="register_name">Full name</label>
        <input id="register_name" required>

        <label for="register_email">Email</label>
        <input id="register_email" type="email" required>

        <label for="register_password">Password</label>
        <input id="register_password" type="password" required placeholder="At least 6 characters">

        <button type="submit" id="registerBtn">Create account</button>
      </form>
      <div class="result" id="registerResult"></div>
    </div>
  </div>

  <div class="staff-panel" id="panel-dashboard">
    <div id="dashboardLoggedOut" class="result err" style="display:block;">
      Log in above to view the dashboard.
    </div>
    <div id="dashboardContent" style="display:none;">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <span id="welcomeMsg" style="font-size:13px; color:var(--paper-dim);"></span>
        <button class="logout-btn" id="logoutBtn">Log out</button>
      </div>
      <div class="stat-grid" id="statGrid"></div>
      <div class="breakdown" id="serviceTypeBreakdown"></div>
      <div class="breakdown" id="requestTypeBreakdown"></div>
    </div>
  </div>
</section>

<div class="config">
  <span>API endpoint</span>
  <input id="apiBase" value="https://8x17e108c6.execute-api.us-east-1.amazonaws.com/prod">
</div>

<script>
function apiBase(){ return document.getElementById('apiBase').value.replace(/\/$/, ''); }
function showResult(el, ok, text){
  el.className = 'result ' + (ok ? 'ok' : 'err');
  el.textContent = text;
}

document.getElementById('appointment_date').valueAsDate = new Date(Date.now() + 7*86400000);

document.getElementById('apptForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('apptBtn');
  const result = document.getElementById('apptResult');
  btn.disabled = true; btn.textContent = 'Booking…';

  const payload = {
    customer_name: document.getElementById('customer_name').value,
    vehicle_reg: document.getElementById('vehicle_reg').value,
    service_type: document.getElementById('service_type').value,
    appointment_date: document.getElementById('appointment_date').value,
    base_rate: parseFloat(document.getElementById('base_rate').value),
    cancellation_policy: document.getElementById('cancellation_policy').value
  };

  try {
    const res = await fetch(apiBase() + '/appointments', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) {
      showResult(result, true,
        `CONFIRMED ✓\n\nAppointment ID: ${data.appointment_id}\nPrice: €${data.price}\nWork order: ${data.work_order_key}`);
      document.getElementById('appointment_id').value = data.appointment_id;
    } else {
      showResult(result, false, 'ERROR: ' + (data.error || JSON.stringify(data)));
    }
  } catch (err) {
    showResult(result, false, 'NETWORK ERROR: ' + err.message);
  }
  btn.disabled = false; btn.textContent = 'Confirm appointment';
});

document.getElementById('requestForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('reqBtn');
  const result = document.getElementById('requestResult');
  btn.disabled = true; btn.textContent = 'Sending…';

  const payload = {
    appointment_id: document.getElementById('appointment_id').value,
    request_type: document.getElementById('request_type').value,
    notes: document.getElementById('notes').value
  };

  try {
    const res = await fetch(apiBase() + '/requests', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) {
      showResult(result, true, `REQUEST LOGGED ✓\n\nRequest ID: ${data.request_id}\nStatus: ${data.status}`);
    } else {
      showResult(result, false, 'ERROR: ' + (data.error || JSON.stringify(data)));
    }
  } catch (err) {
    showResult(result, false, 'NETWORK ERROR: ' + err.message);
  }
  btn.disabled = false; btn.textContent = 'Send request';
});

/* ---------- Staff portal ---------- */

// Tab switching
document.querySelectorAll('.tab-btn').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab-btn').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.staff-panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
    if (tab.dataset.tab === 'dashboard') loadDashboard();
  });
});

function getSession() {
  const raw = localStorage.getItem('staff_session');
  if (!raw) return null;
  try {
    const session = JSON.parse(raw);
    if (new Date(session.expires_at) < new Date()) {
      localStorage.removeItem('staff_session');
      return null;
    }
    return session;
  } catch { return null; }
}

// Register
document.getElementById('registerForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('registerBtn');
  const result = document.getElementById('registerResult');
  btn.disabled = true; btn.textContent = 'Creating…';

  const payload = {
    name: document.getElementById('register_name').value,
    email: document.getElementById('register_email').value,
    password: document.getElementById('register_password').value
  };

  try {
    const res = await fetch(apiBase() + '/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) {
      showResult(result, true, `ACCOUNT CREATED ✓\n\nYou can now log in with ${data.email}`);
      document.getElementById('registerForm').reset();
    } else {
      showResult(result, false, 'ERROR: ' + (data.error || JSON.stringify(data)));
    }
  } catch (err) {
    showResult(result, false, 'NETWORK ERROR: ' + err.message);
  }
  btn.disabled = false; btn.textContent = 'Create account';
});

// Login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const result = document.getElementById('loginResult');
  btn.disabled = true; btn.textContent = 'Logging in…';

  const payload = {
    email: document.getElementById('login_email').value,
    password: document.getElementById('login_password').value
  };

  try {
    const res = await fetch(apiBase() + '/auth/login', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(payload)
    });
    const data = await res.json();
    if (res.ok) {
      localStorage.setItem('staff_session', JSON.stringify(data));
      showResult(result, true, `LOGGED IN ✓\n\nWelcome, ${data.name}. Switch to the Dashboard tab.`);
      document.getElementById('loginForm').reset();
    } else {
      showResult(result, false, 'ERROR: ' + (data.error || JSON.stringify(data)));
    }
  } catch (err) {
    showResult(result, false, 'NETWORK ERROR: ' + err.message);
  }
  btn.disabled = false; btn.textContent = 'Log in';
});

// Logout
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('staff_session');
  document.getElementById('dashboardLoggedOut').style.display = 'block';
  document.getElementById('dashboardContent').style.display = 'none';
});

// Dashboard
async function loadDashboard() {
  const session = getSession();
  const loggedOut = document.getElementById('dashboardLoggedOut');
  const content = document.getElementById('dashboardContent');

  if (!session) {
    loggedOut.style.display = 'block';
    content.style.display = 'none';
    return;
  }

  try {
    const res = await fetch(apiBase() + '/dashboard', {
      headers: { 'Authorization': 'Bearer ' + session.token }
    });
    const data = await res.json();

    if (!res.ok) {
      localStorage.removeItem('staff_session');
      loggedOut.style.display = 'block';
      loggedOut.textContent = 'Session expired — please log in again.';
      content.style.display = 'none';
      return;
    }

    loggedOut.style.display = 'none';
    content.style.display = 'block';
    document.getElementById('welcomeMsg').textContent = `Logged in as ${session.name} (${session.email})`;

    document.getElementById('statGrid').innerHTML = `
      <div class="stat-card"><div class="num">${data.total_appointments}</div><div class="label">Total Appointments</div></div>
      <div class="stat-card"><div class="num">${data.total_requests}</div><div class="label">Total Requests</div></div>
    `;

    const svcRows = Object.entries(data.appointments_by_service_type)
      .map(([k, v]) => `<div class="breakdown-row"><span>${k}</span><span>${v}</span></div>`).join('');
    document.getElementById('serviceTypeBreakdown').innerHTML =
      `<h3>Appointments by Service Type</h3>${svcRows || '<div class="breakdown-row"><span>No data yet</span></div>'}`;

    const reqRows = Object.entries(data.requests_by_type)
      .map(([k, v]) => `<div class="breakdown-row"><span>${k}</span><span>${v}</span></div>`).join('');
    document.getElementById('requestTypeBreakdown').innerHTML =
      `<h3>Requests by Type</h3>${reqRows || '<div class="breakdown-row"><span>No data yet</span></div>'}`;

  } catch (err) {
    loggedOut.style.display = 'block';
    loggedOut.textContent = 'NETWORK ERROR: ' + err.message;
    content.style.display = 'none';
  }
}

// If already logged in from a previous visit, reflect that on load
if (getSession()) {
  // leave login tab as default active; dashboard loads when clicked
}
</script>
</body>

</html>
